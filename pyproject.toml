[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lz-agent"
version = "0.1.0"
description = "LZ Agent — agente pessoal multimodal, acessível e auditável"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow==12.3.0",
  "pypdf==6.16.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
lz-agent = "lz_agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["core/agent/lz_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
