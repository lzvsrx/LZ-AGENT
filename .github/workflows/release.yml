name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - run: dotnet build apps/windows/LzAgent.Windows.csproj -c Release -p:Platform=x64
      - run: dotnet publish apps/windows/LzAgent.Windows.csproj -c Release -p:Platform=x64 --no-build
      - name: Package source and specification
        shell: pwsh
        run: Compress-Archive -Path apps,assets,config,core,data,docs,plugins,shared,versions,README.md,SECURITY.md,CHANGELOG.md -DestinationPath dist/lz-agent-${{ github.ref_name }}-source.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
