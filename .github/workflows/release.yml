name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - run: python -m pip install build cyclonedx-bom==7.3.1
      - run: python -m build
      - name: Generate Python CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/lz-agent-${{ github.ref_name }}-python.cdx.json
      - run: dotnet build apps/windows/LzAgent.Windows.csproj -c Release -p:Platform=x64
      - run: dotnet publish apps/windows/LzAgent.Windows.csproj -c Release -p:Platform=x64 --no-build
      - name: Package Windows alpha
        shell: pwsh
        run: Compress-Archive -Path apps/windows/bin/x64/Release/* -DestinationPath dist/lz-agent-${{ github.ref_name }}-windows-x64-alpha.zip
      - name: Package source and specification
        shell: pwsh
        run: Compress-Archive -Path apps,assets,config,core,data,docs,plugins,shared,versions,README.md,SECURITY.md,CHANGELOG.md -DestinationPath dist/lz-agent-${{ github.ref_name }}-source.zip
      - name: Package avatar source and LODs
        shell: pwsh
        run: |
          Copy-Item assets/avatar/source/LZ_Agent_Master.blend dist/LZ_Agent_Master-${{ github.ref_name }}.blend
          Copy-Item assets/avatar/models/LZ_Agent_Lite.glb dist/LZ_Agent_Lite-${{ github.ref_name }}.glb
          Copy-Item assets/avatar/models/LZ_Agent_Standard.glb dist/LZ_Agent_Standard-${{ github.ref_name }}.glb
          Copy-Item assets/avatar/models/LZ_Agent_Pro.glb dist/LZ_Agent_Pro-${{ github.ref_name }}.glb
          Copy-Item assets/avatar/references/generated-preview.png dist/LZ_Agent-preview-${{ github.ref_name }}.png
      - name: Generate release checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS-${{ github.ref_name }}.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Name development APK
        run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk lz-agent-${{ github.ref_name }}-android-development.apk
          sha256sum lz-agent-${{ github.ref_name }}-android-development.apk > lz-agent-${{ github.ref_name }}-android-development.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            lz-agent-${{ github.ref_name }}-android-development.apk
            lz-agent-${{ github.ref_name }}-android-development.apk.sha256
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux and Flatpak build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -o Acquire::Retries=3
          sudo -E apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev flatpak flatpak-builder ostree elfutils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - working-directory: apps/linux
        run: flutter analyze && flutter test && flutter build linux --release
      - name: Build and validate Flatpak
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=flatpak-repo flatpak-build packaging/linux/dev.lzagent.LzAgent.yml
          flatpak build-bundle flatpak-repo lz-agent-${{ github.ref_name }}-linux-x64.flatpak dev.lzagent.LzAgent --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ostree init --repo=flatpak-verify --mode=archive-z2
          flatpak build-import-bundle --ref=app/dev.lzagent.LzAgent/x86_64/master flatpak-verify lz-agent-${{ github.ref_name }}-linux-x64.flatpak
      - name: Package Linux alpha
        run: |
          test -x apps/linux/build/linux/x64/release/bundle/lz_agent_linux
          tar -C apps/linux/build/linux/x64/release/bundle -czf lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz .
          sha256sum lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz > lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz.sha256
          sha256sum lz-agent-${{ github.ref_name }}-linux-x64.flatpak > lz-agent-${{ github.ref_name }}-linux-x64.flatpak.sha256
          tar -tzf lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ github.ref_name }}
          path: |
            lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz
            lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz.sha256
            lz-agent-${{ github.ref_name }}-linux-x64.flatpak
            lz-agent-${{ github.ref_name }}-linux-x64.flatpak.sha256
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz
            lz-agent-${{ github.ref_name }}-linux-x64-alpha.tar.gz.sha256
            lz-agent-${{ github.ref_name }}-linux-x64.flatpak
            lz-agent-${{ github.ref_name }}-linux-x64.flatpak.sha256
